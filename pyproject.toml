[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-dynamic-range-compressor-limiter-skill"
version = "1.0.0"
description = "Dynamic range compressor and peak limiter with soft-knee smoothing and ballistics level detection."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-dynamic-range-compressor-limiter-skill"
Repository = "https://github.com/alphaparkinc/genpark-dynamic-range-compressor-limiter-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-dynamic-range-compressor-limiter-skill/issues"
